name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Python info
        run: |
          which python
          python --version
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # HIER IST DIE ÄNDERUNG: Wir nutzen jetzt explizit die requirements.txt
          pip install -r requirements.txt
          # Wir installieren das Paket im "Editable Mode", damit Tests die Module finden
          pip install -e . || echo "Setup.py not found, skipping editable install"

      - name: Show pip list
        run: |
          pip list
          
      - name: Run ruff linter
        run: ruff check --output-format=github
        
      - name: Run tests with coverage
        run: pytest --cov=particle_life --cov-fail-under=70
